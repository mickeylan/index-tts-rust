[workspace]
resolver = "2"
members = [
    "crates/indextts-core",
    "crates/indextts-text",
    "crates/indextts-tokenizer",
    "crates/indextts-audio",
    "crates/indextts-gpt",
    "crates/indextts-ort",
    "crates/indextts-pipeline",
    "crates/indextts-ffi",
    "crates/indextts-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["IndexTTS Team"]
description = "Pure Rust inference library for IndexTTS-2.5"
repository = "https://github.com/index-tts/indextts-rs"
keywords = ["tts", "audio", "speech-synthesis", "indextts"]
categories = ["multimedia", "scientific", "api-bindings"]

[workspace.dependencies]
# Workspace crate path dependencies
indextts-core = { path = "crates/indextts-core" }
indextts-text = { path = "crates/indextts-text" }
indextts-tokenizer = { path = "crates/indextts-tokenizer" }
indextts-audio = { path = "crates/indextts-audio" }
indextts-gpt = { path = "crates/indextts-gpt" }
indextts-ort = { path = "crates/indextts-ort" }
indextts-pipeline = { path = "crates/indextts-pipeline" }
indextts-ffi = { path = "crates/indextts-ffi" }
indextts-cli = { path = "crates/indextts-cli" }

# Core ML dependencies
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
cudarc = { version = "0.13.9", default-features = false, features = ["cuda-12080"] }
safetensors = "0.8"
ndarray = { version = "0.16", features = ["blas"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
tiktoken-rs = "0.9"
base64 = "0.22"

# Audio dependencies
hound = "3.5"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"

# Utility dependencies
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync"] }
once_cell = "1.20"
dashmap = "6.0"

# Dev dependencies
criterion = "0.5"
tempfile = "3.15"
proptest = "1.5"
similar-asserts = "0.7"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Bench profile is inherited from release
